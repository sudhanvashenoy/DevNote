<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenkins CI/CD Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
        }
        h1 { color: #2d3748; margin-bottom: 10px; }
        p  { color: #718096; margin-bottom: 20px; }
        .badge {
            background: #48bb78;
            color: white;
            padding: 8px 20px;
            border-radius: 999px;
            font-weight: bold;
        }
        .info { margin-top: 20px; color: #a0aec0; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Hello from Jenkins!</h1>
        <p>This page was automatically deployed via CI/CD Pipeline</p>
        <span class="badge">✅ Deployed Successfully</span>
        <div class="info">
            <p>Master EC2 → Agent EC2 → Production EC2</p>
            <p>Powered by Jenkins + Docker + AWS</p>
        </div>
    </div>
</body>
</html>
