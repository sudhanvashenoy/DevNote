<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevNote | The Knowledge OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/framer-motion/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background-color: #030303; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion;
        const { Terminal, ShieldCheck, Layout, Code, Users, 
                FileText, CheckCircle, ArrowRight, Play, Star, 
                Zap, GlobeLock, Cpu, Database, Command, Search, 
                CheckSquare, RefreshCw, Mail, Lock, Server } = lucide;

        function DevNoteLandingPage() {
            return (
                <div className="min-h-screen bg-[#030303] text-gray-300 font-sans selection:bg-purple-500/30">
                    {/* Simplified Navigation */}
                    <nav className="fixed top-0 w-full z-50 bg-[#030303]/80 backdrop-blur-2xl border-b border-white/5 p-6">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-2 font-bold text-white text-xl">
                                <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-500 to-blue-600 flex items-center justify-center"><Terminal className="w-4 h-4 text-white" /></div>
                                DevNote.
                            </div>
                            <button className="px-5 py-2 text-sm font-bold text-black bg-white rounded-full">Book a Demo</button>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <section className="pt-44 pb-32 px-6">
                        <div className="max-w-7xl mx-auto grid xl:grid-cols-2 gap-16 items-center">
                            <div>
                                <h1 className="text-5xl md:text-7xl font-extrabold text-white leading-[1.1] mb-6">The knowledge OS for scaling teams.</h1>
                                <p className="text-xl text-gray-400 mb-10 font-light">Unify engineering docs, HR policies, and architecture decisions in one semantic base.</p>
                                <button className="px-8 py-4 bg-white text-black font-bold rounded-full">Start Deploying</button>
                            </div>
                            {/* Graphic Placeholder */}
                            <div className="h-[400px] bg-[#0a0a0a] rounded-2xl border border-white/10 flex items-center justify-center text-gray-700">
                                [Animated MacBook Interface]
                            </div>
                        </div>
                    </section>

                    {/* Pricing Preview */}
                    <section className="py-32 border-t border-white/5">
                        <div className="max-w-7xl mx-auto text-center px-6">
                            <h2 className="text-4xl font-bold text-white mb-16">Transparent Pricing</h2>
                            <div className="grid md:grid-cols-3 gap-8">
                                {['Team', 'Business', 'Enterprise'].map((tier) => (
                                    <div key={tier} className="p-10 rounded-[2rem] bg-[#0a0a0a] border border-white/5">
                                        <h3 className="text-xl font-bold text-white mb-4">{tier} Plan</h3>
                                        <button className="w-full py-3 rounded-xl bg-white/5 text-white font-bold text-sm">Inquire Plan</button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    <footer className="py-20 text-center text-gray-600 text-sm">
                        © 2026 DevNote Systems Inc.
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DevNoteLandingPage />);
    </script>
</body>
</html>
